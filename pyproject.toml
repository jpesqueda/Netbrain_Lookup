[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbrain-lookup"
version = "1.0.0"
description = "NetBrain IP/MAC endpoint lookup with CLI and interactive terminal UI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Peskicorp"}]
dependencies = ["rich>=13.7", "textual>=1.0,<9"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: System :: Networking", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/jpesqueda/Netbrain_Lookup"
Issues = "https://github.com/jpesqueda/Netbrain_Lookup/issues"

[project.scripts]
Netbrain_Lookup = "netbrain_lookup.cli:main"
netbrain-lookup = "netbrain_lookup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
